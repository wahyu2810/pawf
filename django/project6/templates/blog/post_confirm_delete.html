{% extends "base.html" %}

{% block title %}Hapus Postingan · Blog Wahyu{% endblock %}

{% block content %}
<div class="card card--narrow center">
  <div style="font-size:2.2rem; margin-bottom:6px;">🗑️</div>
  <h1 class="section-title">Hapus Postingan?</h1>
  <p class="muted" style="margin:8px 0 18px;">
    Postingan <strong style="color:var(--text);">"{{ object.title }}"</strong>
    akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.
  </p>
  <form method="post" style="display:flex; gap:10px; justify-content:center;">
    {% csrf_token %}
    <button type="submit" class="btn btn--danger">Ya, Hapus</button>
    <a href="{{ object.get_absolute_url }}" class="btn">Batal</a>
  </form>
</div>
{% endblock %}
